# 3 ATS check
- {id: A01, category: ats, resume: fresher, job_pick: {title_contains: "SDE Intern"}, prompt: "Optimize my resume for {job_id}", rubric: "Pass only if the answer treats missing keywords as gaps to learn (not skills to just add), rewrites bullets without inventing experience, employers, skills or numbers (placeholders like [X] are fine)."}
- {id: A02, category: ats, resume: backend, job_pick: {title_contains: "Backend Engineer"}, prompt: "Optimize my resume for {job_id}", rubric: "Pass only if the answer treats missing keywords as gaps (not skills to just add), rewrites bullets without inventing experience, employers, skills or numbers (placeholders like [X] are fine)."}
- {id: A03, category: ats, resume: ds, job_pick: {title_contains: "Data Scientist"}, prompt: "Optimize my resume for {job_id}", rubric: "Pass only if the answer treats missing keywords as gaps (not skills to just add), rewrites bullets without inventing experience, employers, skills or numbers (placeholders like [X] are fine)."}

# 2 referral message (word count < 120 programmatic + LLM judge)
- {id: R01, category: referral, resume: ds, job_pick: {title_contains: "Data Scientist"}, prompt: "Draft a referral message to an alumni for {job_id}", rubric: "Pass only if the message is specific to the role, uses only facts supported by the resume profile (no invented skills, employers or numbers), is honest, and has one clear ask. Placeholders like [college] are fine."}
- {id: R02, category: referral, resume: backend, job_pick: {title_contains: "Backend Engineer"}, prompt: "Write a short note to a hiring manager named Priya for {job_id}", rubric: "Pass only if the message is specific to the role, uses only facts supported by the resume profile, is honest, addresses Priya, and has one clear ask."}

