<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friday – AI Career Copilot (prototype)</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>  #resume-chip{max-width:820px;margin:0 auto;width:100%;padding:6px 16px;font-size:13px;color:var(--muted)}
  #resume-chip[hidden]{display:none}
  #resume-chip b{color:var(--text)} #resume-chip .warn{color:#b45309}
  .up{display:flex;align-items:center;font-size:20px;cursor:pointer;padding:0 4px}
  .job .row{display:flex;gap:8px;flex-wrap:wrap}
  :root{--accent:#4f46e5;--bg:#f7f8fb;--card:#fff;--text:#1b1f2a;--muted:#6b7280;--line:#e5e7eb}
  *{box-sizing:border-box} html,body{height:100%;margin:0}
  body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
  header{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  header b{color:var(--accent);font-size:18px} header span{color:var(--muted);font-size:13px;margin-left:8px}
  #chat{flex:1;overflow-y:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
  .msg{margin:10px 0;max-width:92%} .user{margin-left:auto;background:var(--accent);color:#fff;padding:10px 14px;border-radius:14px 14px 2px 14px;width:fit-content}
  .bot .bubble{background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:14px 14px 14px 2px}
  .bubble p{margin:.4em 0} .bubble ul,.bubble ol{padding-left:20px}
  .used{font-size:12px;color:var(--muted);margin-top:4px}
  .cards{display:grid;gap:10px;margin:8px 0}
  .job{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .job h4{margin:0 0 2px;font-size:15px} .job .sub{color:var(--muted);font-size:13px}
  .chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#eef2ff;color:var(--accent);margin:4px 4px 0 0}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);margin-left:6px}
  .job button{margin-top:8px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
  #starters{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 8px;max-width:820px;margin:0 auto;width:100%}
  #starters button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 12px;cursor:pointer;font-size:13px}
  form{display:flex;gap:8px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);max-width:820px;margin:0 auto;width:100%}
  input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
  form button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:0 18px;cursor:pointer}
  form button:disabled{opacity:.5} footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 10px 10px}
  .dots span{animation:b 1s infinite;display:inline-block} .dots span:nth-child(2){animation-delay:.15s} .dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{50%{opacity:.2}}
</style>
</head>
<body>
<header><b>Friday</b><span>Your AI Career Copilot · prototype</span></header>
<div id="chat"><div class="msg bot"><div class="bubble">Hi, I'm Friday 👋 I can find jobs, explain your fit, and more. Try a prompt below. <i>(Uses sample data.)</i></div></div></div>
<div id="starters"></div>
<div id="resume-chip" hidden></div>
<form id="f"><label class="up" title="Upload resume (PDF/DOCX, max 2 MB)">📎<input id="file" type="file" accept=".pdf,.docx" hidden></label><input id="in" placeholder="Ask Friday about jobs..." autocomplete="off" maxlength="2000"><button id="go">Send</button></form>

<script>
const sid = (crypto.randomUUID && crypto.randomUUID()) || String(Date.now()) + Math.random().toString(36).slice(2);
const chat = document.getElementById('chat'), input = document.getElementById('in'), go = document.getElementById('go');
const STARTERS = ["Show me job openings at AI startups in Hyderabad",
  "What are the latest software jobs for college students",
  "Optimize my resume for the first job on this list"];
const starters = document.getElementById('starters');
STARTERS.forEach(t => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => send(t); starters.appendChild(b); });

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const md = s => DOMPurify.sanitize(marked.parse(s));
const scroll = () => chat.scrollTop = chat.scrollHeight;

function jobCard(j) {
  const c = el('div', 'job');
  const h = el('h4', '', j.title); h.appendChild(el('span', 'badge', j.work_mode)); c.appendChild(h);
  c.appendChild(el('div', 'sub', `${j.company} · ${j.city} · ${j.exp_min}-${j.exp_max} yrs${j.is_internship ? ' · Internship' : ''} · ${j.id}`));
  const w = el('div'); j.skills.forEach(s => w.appendChild(el('span', 'chip', s))); c.appendChild(w);
  const row = el('div', 'row');
  const b = el('button', '', 'Why am I a fit?'); b.onclick = () => send(`Why am I a fit for ${j.id}?`);
  const b2 = el('button', '', 'ATS check'); b2.onclick = () => send(`Optimize my resume for ${j.id}`);
  row.append(b, b2); c.appendChild(row);
  return c;
}

async function send(text) {
  text = (text || '').trim(); if (!text) return;
  starters.style.display = 'none'; input.value = ''; go.disabled = true;
  chat.appendChild(el('div', 'msg user', text));
  const wrap = el('div', 'msg bot'), cards = el('div', 'cards'), bubble = el('div', 'bubble'), used = el('div', 'used');
  bubble.innerHTML = '<span class="dots"><span>●</span><span>●</span><span>●</span></span>';
  wrap.append(bubble, cards, used); chat.appendChild(wrap); scroll();
  let raw = '';
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sid, message: text }) });
    if (!res.ok) throw new Error(res.status === 429 ? 'Too many requests. Please wait a moment.' : 'Server error. Please try again.');
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === 'token') { raw += ev.text; bubble.innerHTML = md(raw); }
        else if (ev.type === 'jobs') { ev.jobs.forEach(j => cards.appendChild(jobCard(j))); }
        else if (ev.type === 'error') { bubble.innerHTML = md(raw + (raw ? '\n\n' : '') + '⚠️ ' + ev.text); }
        else if (ev.type === 'done' && ev.tools.length) { used.textContent = 'Friday used: ' + [...new Set(ev.tools)].join(', '); }
        scroll();
      }
    }
    if (!raw && !bubble.textContent.includes('⚠️')) bubble.textContent = '(no response)';
  } catch (e) { bubble.textContent = '⚠️ ' + e.message; }
  go.disabled = false; input.focus(); scroll();
}
const chip = document.getElementById('resume-chip'), fileIn = document.getElementById('file');
fileIn.onchange = async () => {
  const f = fileIn.files[0]; if (!f) return;
  chip.hidden = false;
  if (f.size > 2 * 1024 * 1024) { chip.textContent = '⚠️ File too large (max 2 MB).'; fileIn.value = ''; return; }
  chip.textContent = 'Reading your resume…';
  const fd = new FormData(); fd.append('session_id', sid); fd.append('file', f);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');
    chip.textContent = '';
    chip.appendChild(el('b', '', `Resume loaded ✓ (${data.years_experience} yrs). Skills detected: `));
    chip.appendChild(document.createElement('br'));
    data.skills.slice(0, 14).forEach(s => chip.appendChild(el('span', 'chip', s)));
    if (!data.skills.length) chip.appendChild(el('span', '', 'none found'));
    if (data.suspicious) chip.appendChild(el('div', 'warn', 'Heads up: your resume contains instruction-like text. Friday treats resume text as data and ignores it.'));
  } catch (e) { chip.textContent = '⚠️ ' + e.message; }
  fileIn.value = '';
};
document.getElementById('f').onsubmit = e => { e.preventDefault(); send(input.value); };
</script>
</body>
</html>
